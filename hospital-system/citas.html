<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Citas</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h2>Programar Cita</h2>

<form id="formCita">

<input type="text" id="pacienteCita" placeholder="Paciente" required>

<input type="text" id="medicoCita" placeholder="Médico" required>

<input type="date" id="fechaCita" required>

<button type="submit">Agendar</button>

</form>

<h3>Lista de Citas</h3>

<table>

<thead>
<tr>
<th>Paciente</th>
<th>Médico</th>
<th>Fecha</th>
</tr>
</thead>

<tbody id="tablaCitas"></tbody>

</table>

<script src="js/app.js"></script>

</body>
</html>
